name: release

# A tag v* builds the app and the BPF object with the vendored toolchain,
# packs service.toml with dist/, and publishes bomtastic.tar.gz on a
# GitHub release, so a host can `yeet service apply` it from the release
# URL with no Node or toolchain of its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        run: |
          npm ci
          npm run build
      - name: make pack
        run: make pack
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bomtastic.tar.gz \
            --title "bomtastic ${GITHUB_REF_NAME}" \
            --notes "yeet service apply -f https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/bomtastic.tar.gz"
